<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UstaTop PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --bg: #f4f7f6; --card-bg: #ffffff; --text: #2d3436; --primary: #0984e3; --secondary: #636e72; }
        .dark { --bg: #1e272e; --card-bg: #2f3640; --text: #f5f6fa; --primary: #00a8ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 15px; text-align: center; }
        button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        .btn-back { background: var(--secondary); margin-top: 15px; }
        .delete-btn { background: #ff7675; width: auto; padding: 5px 10px; font-size: 12px; margin-top: 5px; }
        .badge { display: inline-block; background: #dfe6e9; color: #2d3436; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button onclick="toggleDark()" style="width: 50px;">🌓</button>
        <h3 style="margin: 0;">UstaTop PRO</h3>
        <span></span>
    </div>
    <div id="app"></div>
</div>

<script type="module">
    // 1. Firebase Importlar
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 2. Sazlamalar
    const firebaseConfig = { databaseURL: "https://ustataw-feea0-default-rtdb.firebaseio.com/" };
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    const BOT_TOKEN = "8729214778:AAHXuYpAFMVF618IU6ybrdisQQl1Vm7NGX8";
    const ADMIN_ID = "6415783515"; // Usı jerge ózińizdiń sanlı ID-ni qoyıń

    // 3. Gmail-siz identifikaciya (Device ID)
    let deviceId = localStorage.getItem("ustatop_device_id") || "dev_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("ustatop_device_id", deviceId);

    const tg = window.Telegram.WebApp;
    tg.expand();

    let ustalar = [];

    // Bazanı real-waqıtta tıńlaw
    onValue(ref(db, 'ustalar'), (snapshot) => {
        const data = snapshot.val();
        ustalar = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        home();
    });

    // Telegram-ǵa xabar jiberiw funksiyası
    async function sendTelegramAdmin(msg) {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: ADMIN_ID, text: msg })
        });
    }

    window.toggleDark = () => document.body.classList.toggle("dark");

    window.home = () => {
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h3>Xush kelibsiz!</h3>
                <button onclick="mijoz()">Mijoz (Usta izlew)</button>
                <button class="btn-outline" style="background:none; color:var(--primary); border:2px solid var(--primary);" onclick="usta()">Ustaman (Dizimnen ótiw)</button>
                <p style="font-size:12px; color:gray; margin-top:15px;">Gmail-siz kiriw aktiv</p>
            </div>`;
    }

    window.mijoz = () => {
        let list = "";
        ustalar.forEach(u => {
            list += `
                <div class="card" style="text-align:left; padding:15px;">
                    <b>${u.name}</b> <br>
                    <span class="badge">${u.job}</span> <br>
                    📞 <a href="tel:${u.phone}">${u.phone}</a> <br>
                    ${u.deviceId === deviceId ? `<button onclick="oshiriw('${u.id}')" class="delete-btn">Óshiriw</button>` : ''}
                </div>`;
        });
        document.getElementById("app").innerHTML = `<h3>Usta dizimi</h3> ${list} <button onclick="home()" class="btn-back">Arqaǵa</button>`;
    }

    window.usta = () => {
        document.getElementById("app").innerHTML = `
            <div class="card">
                <h3>Dizimnen ótiw</h3>
                <input id="uname" placeholder="Atıńız hám familiyańız" autocomplete="off">
                <input id="ujob" placeholder="Kásibińiz (mısalı: Elektrik)" autocomplete="off">
                <input id="uphone" value="+998" type="tel">
                <button onclick="save()">Saqlaw</button>
                <button onclick="home()" class="btn-back">Arqaǵa</button>
            </div>`;
    }

    window.save = () => {
        const name = document.getElementById("uname").value;
        const job = document.getElementById("ujob").value;
        const phone = document.getElementById("uphone").value;

        if (name && job && phone.length > 10) {
            push(ref(db, 'ustalar'), { name, job, phone, deviceId })
            .then(() => {
                // Adminge xabar jiberiw
                sendTelegramAdmin(`🔔 JAŃA USTA:\n👤 ${name}\n🛠 ${job}\n📞 ${phone}`);
                tg.HapticFeedback.notificationOccurred('success');
                alert("Múwappaqiyatlı saqlandı!");
                home();
            });
        } else { alert("Maǵlıwmatlardı tolıq kiritiń!"); }
    }

    window.oshiriw = (id) => {
        if (confirm("Óz maǵlıwmatıńızdı óshiresiz be?")) {
            remove(ref(db, `ustalar/${id}`));
        }
    }

    home();
</script>
</body>
</html>
