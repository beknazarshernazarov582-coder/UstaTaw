<!DOCTYPE html>
<html lang="kaa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UstaTop PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root { --bg: #f4f7f6; --card-bg: #ffffff; --text: #2d3436; --primary: #0984e3; --secondary: #636e72; }
    .dark { --bg: #1e272e; --card-bg: #2f3640; --text: #f5f6fa; --primary: #00a8ff; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; margin: 0; padding: 15px; }
    .container { max-width: 480px; margin: auto; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 15px; text-align: center; }
    button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-outline { background: none; border: 2px solid var(--primary); color: var(--primary); }
    .btn-back { background: var(--secondary); margin-top: 15px; }
    .checkbox-group { text-align: left; max-height: 250px; overflow-y: auto; padding: 10px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 15px; }
    .checkbox-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .checkbox-item input { width: 20px; height: 20px; margin-right: 12px; }
    .badge { display: inline-block; background: #dfe6e9; color: #2d3436; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin: 2px; }
    input { width: 90%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    .delete-btn { background: #ff7675; font-size: 12px; padding: 8px; width: auto; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <button onclick="toggleDark()" style="width: 50px;">🌓</button>
    <h3 style="margin: 0;">UstaTop PRO</h3>
    <select onchange="setLang(this.value)" id="langSelect" style="padding: 5px; border-radius: 5px;">
      <option value="kaa">Qaraqalpaq</option>
      <option value="uz">O'zbekcha</option>
      <option value="ru">Русский</option>
    </select>
  </div>
  <div id="app"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://ustataw-feea0-default-rtdb.firebaseio.com/" };
  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);

  const tg = window.Telegram.WebApp;
  tg.expand();

  // --- SAZLAMALAR ---
  const BOT_TOKEN = "8729214778:AAHXuYpAFMVF618IU6ybrdisQQl1Vm7NGX8";
  const ADMIN_CHAT_ID = "7777284635"; // Ózińizdiń ID-ni qoyıń
  let deviceId = localStorage.getItem("ustatop_device") || "id_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("ustatop_device", deviceId);

  let lang = localStorage.getItem("appLang") || "kaa";
  let ustalar = [];

  const kasipler = ["Elektrik", "Santexnik", "Gipsokarton ustası", "Malyar", "Kafelshik", "Mebelshi", "Kondicioner ustası", "Suw filtri ustası", "Kir juwıw mashina ustası", "Shtukaturka", "Gaz ustası", "Internet ustası"];

  const text = {
    kaa: { who: "Siz kimsiz?", client: "Mijoz (Izlew)", worker: "Ustaman (Dizim)", choose: "Kásipti saylań", call: "Qońıraw", save: "Saqlaw", name: "Atı-familiya", phone: "Nomer", back: "Arqaǵa", delete: "🗑 Óshiriw" },
    uz: { who: "Siz kimsiz?", client: "Mijoz (Izlash)", worker: "Ustaman (Ro'yxat)", choose: "Kasbni tanlang", call: "Qo'ng'iroq", save: "Saqlash", name: "Ism-familiya", phone: "Raqam", back: "Orqaga", delete: "🗑 O'chirish" },
    ru: { who: "Кто вы?", client: "Клиент (Поиск)", worker: "Мастер (Регистрация)", choose: "Выберите услугу", call: "Позвонить", save: "Сохранить", name: "Имя и фамилия", phone: "Номер", back: "Назад", delete: "🗑 Удалить" }
  };

  onValue(ref(db, 'ustalar'), (snapshot) => {
    const data = snapshot.val();
    ustalar = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
    home();
  });

  function sendAdmin(msg) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: msg })
    });
  }

  window.toggleDark = () => document.body.classList.toggle("dark");
  window.setLang = (l) => { lang = l; localStorage.setItem("appLang", l); home(); };

  window.home = () => {
    document.getElementById("app").innerHTML = `
      <div class="card">
        <h3>${text[lang].who}</h3>
        <button onclick="mijoz()">${text[lang].client}</button>
        <button class="btn-outline" onclick="usta()">${text[lang].worker}</button>
      </div>`;
  };

  window.mijoz = () => {
    let list = kasipler.map(k => `<button class="btn-outline" onclick="show('${k}')">${k}</button>`).join("");
    document.getElementById("app").innerHTML = `<div class="card"><h3>${text[lang].choose}</h3>${list}<button onclick="home()" class="btn-back">${text[lang].back}</button></div>`;
  };

  window.show = (job) => {
    let found = ustalar.filter(u => u.jobs && u.jobs.includes(job));
    let html = `<h3>${job}</h3>`;
    found.forEach(u => {
      let canDelete = (u.deviceId === deviceId || deviceId === "ADMIN_TOKEN_OSI_JERGE"); 
      html += `
        <div class="card">
          <h4>${u.name}</h4>
          <p>📞 ${u.phone}</p>
          <div style="display:flex; gap:10px;">
            <a href="tel:${u.phone}" style="flex:1;"><button style="margin:0;">${text[lang].call}</button></a>
            ${canDelete ? `<button onclick="oshiriw('${u.id}')" class="delete-btn">${text[lang].delete}</button>` : ''}
          </div>
        </div>`;
    });
    html += `<button onclick="mijoz()" class="btn-back">${text[lang].back}</button>`;
    document.getElementById("app").innerHTML = html;
  };

  window.usta = () => {
    let boxes = kasipler.map(k => `<div class="checkbox-item"><input type="checkbox" name="job" value="${k}" id="${k}"><label for="${k}">${k}</label></div>`).join("");
    document.getElementById("app").innerHTML = `
      <div class="card">
        <h3>${text[lang].worker}</h3>
        <input id="uname" placeholder="${text[lang].name}" autocomplete="off">
        <div class="checkbox-group">${boxes}</div>
        <input id="uphone" type="tel" value="+998" autocomplete="off">
        <button onclick="save()">${text[lang].save}</button>
        <button onclick="home()" class="btn-back">${text[lang].back}</button>
      </div>`;
  };

  window.save = () => {
    const name = document.getElementById("uname").value;
    const phone = document.getElementById("uphone").value;
    const selected = Array.from(document.querySelectorAll('input[name="job"]:checked')).map(c => c.value);
    if (!name || selected.length === 0 || phone.length < 13) return alert("Tolıq kiritiń!");

    push(ref(db, 'ustalar'), { name, jobs: selected, phone, deviceId })
      .then(() => {
        sendAdmin(`🔔 Jańa usta: ${name}\n📞 Tel: ${phone}\n🛠 Kásibi: ${selected.join(", ")}`);
        tg.HapticFeedback.notificationOccurred('success');
        home();
      });
  };

  window.oshiriw = (id) => {
    if (confirm("Óshiriwge isenimli misiz?")) {
      remove(ref(db, `ustalar/${id}`)).then(() => home());
    }
  };

  home();
</script>
</body>
</html>
